name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar y probar
        shell: pwsh
        run: |
          dotnet build Misearch.slnx -c Release --warnaserror
          dotnet test tests/Misearch.CoreTests/Misearch.CoreTests.csproj -c Release --no-build

      - name: Publicar el ejecutable portable
        shell: pwsh
        run: |
          dotnet publish App/Misearch.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # El instalador embebe el portable publicado arriba: se compila después.
      - name: Instalar WiX y la extensión del bootstrapper
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Construir el MSI
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/Misearch.exe")) {
            throw "Falta publish/Misearch.exe: el paso anterior no genero el ejecutable."
          }
          wix build installer/Misearch.wxs -arch x64 `
            -d SourceDir=publish -d IconFile=App/Assets/misearch.ico `
            -o publish/Misearch-0.1.2-win-x64.msi

      - name: Construir el Setup (bundle)
        shell: pwsh
        run: |
          wix build installer/MisearchBundle.wxs -arch x64 -ext WixToolset.BootstrapperApplications.wixext `
            -d IconFile=App/Assets/misearch.ico -d MsiPath=publish/Misearch-0.1.2-win-x64.msi `
            -o publish/Misearch-0.1.2-win-x64-Setup.exe

      - name: Empaquetar el portable en ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "Misearch"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item publish/Misearch.exe $stage
          Copy-Item publish/Assets $stage -Recurse
          Compress-Archive -Path "$stage\*" -DestinationPath publish/Misearch-0.1.2-win-x64.zip -CompressionLevel Optimal

      - name: Localizar signtool (opcional)
        id: signtool
        shell: pwsh
        run: |
          # Que falte signtool no puede romper un release: solo impide firmar.
          $st = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $st) {
            Write-Host "::warning::signtool no encontrado: el release se publicara sin firma."
            "path=" >> $env:GITHUB_OUTPUT
          } else {
            "path=$st" >> $env:GITHUB_OUTPUT
          }

      - name: Firmar los binarios (si hay certificado)
        if: ${{ steps.signtool.outputs.path != '' }}
        shell: pwsh
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT)) {
            Write-Host "No se proporciono certificado de firma. Se omite la firma."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CODE_SIGN_CERT))

          $signtool = "${{ steps.signtool.outputs.path }}"
          $files = Get-ChildItem .\publish\*.exe, .\publish\*.msi -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Host "No hay binarios que firmar."
            exit 0
          }

          foreach ($file in $files) {
            & $signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $certPath /p $env:CODE_SIGN_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "La firma de $($file.Name) fallo con codigo $LASTEXITCODE." }
          }

          Remove-Item $certPath -Force

      - name: Crear los checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem .\publish\*.exe, .\publish\*.msi, .\publish\*.zip -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Host "No hay binarios para calcular checksums."
            exit 0
          }
          $files | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name } |
            Out-File -Encoding ASCII publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/*.exe
            publish/*.msi
            publish/*.zip
            publish/SHA256SUMS.txt
          fail_on_unmatched_files: false
